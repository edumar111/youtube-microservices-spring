spring:
  application:
    name: product-service
  # Java 25: virtual threads para el servidor web
  threads:
    virtual:
      enabled: true
  # Perfil por defecto: local (H2). En Docker se activa 'postgres' vía SPRING_PROFILES_ACTIVE
  profiles:
    active: local
  # Ep. 11: Resource Server — validación de JWT por JWKS del Authorization Server
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  sql:
    init:
      mode: always
  # Ep. 12 — Kafka (participante de la saga)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: product-saga
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8091

# Ep. 12 — saga desactivada por defecto (se activa en Docker y en el test de Kafka)
app:
  saga:
    enabled: ${APP_SAGA_ENABLED:false}
    topics:
      invoice-created: invoice-created
      stock-processed: stock-processed

management:
  # Ep. 10: tracing distribuido
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/productdb}
    username: ${SPRING_DATASOURCE_USERNAME:store}
    password: ${SPRING_DATASOURCE_PASSWORD:store}
    driver-class-name: org.postgresql.Driver
