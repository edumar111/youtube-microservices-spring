# Ep. 9 — Añade Kong (DB-less) al stack. Se usa como override del compose base:
#   docker compose -f docker-compose.yml -f docker-compose.kong.yml up -d
# Proxy en http://localhost:8000 (p.ej. GET http://localhost:8000/products),
# Admin API en http://localhost:8001.
services:
  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      # No cachear fallos de DNS: permite levantar 'assistant' después de Kong sin reiniciarlo.
      KONG_DNS_ERROR_TTL: "1"
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8000:8000"   # proxy
      - "8001:8001"   # admin API
    depends_on:
      product-service:
        condition: service_started
      customer-service:
        condition: service_started
      shopping-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
