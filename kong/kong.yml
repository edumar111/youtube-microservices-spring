# Ep. 9 — Kong API Gateway en modo DB-less (declarativo).
# Puerta de entrada única: enruta a los microservicios por su DNS de Docker.
_format_version: "3.0"
_transform: true

services:
  - name: product-service
    url: http://product-service:8091
    routes:
      - name: products
        paths:
          - /products
        strip_path: false
      - name: categories
        paths:
          - /categories
        strip_path: false

  - name: customer-service
    url: http://customer-service:8092
    routes:
      - name: customers
        paths:
          - /customers
        strip_path: false
      - name: regions
        paths:
          - /regions
        strip_path: false

  - name: shopping-service
    url: http://shopping-service:8093
    routes:
      - name: invoices
        paths:
          - /invoices
        strip_path: false

  # Ep. 15 — asistente (Spring AI). Solo responde si el servicio 'assistant' está levantado
  # (docker-compose.assistant.yml, requiere ANTHROPIC_API_KEY).
  - name: assistant-service
    url: http://assistant:8095
    routes:
      - name: assistant
        paths:
          - /assistant
        strip_path: false

# Rate limiting global (política local, en memoria de cada nodo Kong).
plugins:
  - name: rate-limiting
    config:
      minute: 60
      policy: local
  # CORS para la SPA Angular (ep. 4 del mini-curso de frontend). Kong responde el preflight.
  - name: cors
    config:
      origins:
        - http://localhost:4200
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      credentials: true
      max_age: 3600
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true
