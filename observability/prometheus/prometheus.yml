# Ep. 13 — Prometheus: scrapea las métricas de Micrometer expuestas en /actuator/prometheus.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['product-service:8091']
  - job_name: customer-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['customer-service:8092']
  - job_name: shopping-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['shopping-service:8093']
