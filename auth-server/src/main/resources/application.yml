spring:
  application:
    name: auth-server
  threads:
    virtual:
      enabled: true

server:
  port: 9000

# El issuer se resuelve automáticamente; en Docker se fija por variable de entorno para
# que los claims 'iss' y las URLs de metadatos usen el host correcto.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
