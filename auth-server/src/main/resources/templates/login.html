<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Iniciar sesión · Online Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --primary:#ff6600; --primary-600:#e55c00; --ink:#222; --muted:#666;
      --surface-2:#f5f5f5; --border:#e0e0e0; --sale:#e60012; --sale-050:#ffeaeb; --success:#008a00;
      --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    }
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--surface-2);
         font-family:var(--font);color:var(--ink);padding:1.25rem;}
    .card{width:100%;max-width:400px;background:#fff;border:1px solid var(--border);border-radius:16px;
          box-shadow:0 8px 24px rgba(0,0,0,.08);padding:2rem 1.9rem;}
    .brand{font-size:1.7rem;font-weight:800;color:var(--primary);letter-spacing:-.02em;text-align:center;margin:0 0 .25rem;}
    .brand span{color:var(--ink);}
    .sub{text-align:center;color:var(--muted);font-size:.9rem;margin:0 0 1.5rem;}
    label{display:block;font-size:.82rem;font-weight:700;color:var(--ink);margin:.9rem 0 .35rem;}
    input[type=text],input[type=password]{width:100%;font-family:var(--font);font-size:1rem;color:var(--ink);
      background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:.75rem .9rem;}
    input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(255,102,0,.12);}
    button{width:100%;margin-top:1.4rem;background:var(--primary);color:#fff;font-family:var(--font);font-weight:800;
      font-size:1rem;border:none;border-radius:22px;padding:.85rem;cursor:pointer;box-shadow:0 4px 12px rgba(255,102,0,.28);
      transition:background .15s ease, transform .1s ease;}
    button:hover{background:var(--primary-600);} button:active{transform:scale(.99);}
    .alert{border-radius:10px;padding:.7rem .85rem;font-size:.86rem;font-weight:600;margin-bottom:1rem;}
    .alert-error{background:var(--sale-050);color:var(--sale);}
    .alert-ok{background:#e7f6e7;color:var(--success);}
    .hint{margin-top:1.2rem;text-align:center;font-size:.8rem;color:var(--muted);}
    .hint code{background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:.1rem .4rem;color:var(--ink);}
    .safe{margin-top:1rem;text-align:center;color:var(--muted);font-size:.78rem;}
  </style>
</head>
<body>
  <div class="card">
    <h1 class="brand">Online<span>Store</span></h1>
    <p class="sub">Inicia sesión para completar tu compra</p>

    <div th:if="${param.error}" class="alert alert-error">Usuario o contraseña incorrectos.</div>
    <div th:if="${param.logout}" class="alert alert-ok">Cerraste sesión correctamente.</div>

    <form th:action="@{/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required/>
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required/>
      <button type="submit">Iniciar sesión</button>
    </form>

    <p class="hint">Demo: <code>user</code> / <code>password</code></p>
    <p class="safe">🔒 Pago seguro · Garantía de devolución</p>
  </div>
</body>
</html>
